<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EAM eszközleltár" />
    <title>EAM - Eszköz bevezetése</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Fő navigáció">
        <div class="brand" aria-label="EAM Eötvös Alkotó Műhely">
          <img class="brand-logo" src="/assets/logokozep.png" alt="EAM Eötvös Alkotó Műhely" />
        </div>

        <nav class="navigation">
          <a class="navigation-link navigation-link--active" href="#uj-bevezetes" data-page="entry">
            <span class="navigation-icon navigation-icon--plus" aria-hidden="true">+</span>
            <span>Új bevezetés</span>
          </a>
          <a class="navigation-link" href="#leltar" data-page="inventory">
            <span class="navigation-icon navigation-icon--list" aria-hidden="true">☷</span>
            <span>Leltár</span>
          </a>
          <a class="navigation-link" href="#matricainator" data-page="labels">
            <span class="navigation-icon navigation-icon--tag" aria-hidden="true">▣</span>
            <span>Matricainátor</span>
          </a>
        </nav>
      </aside>

      <main class="main-content">
        <section class="inventory-page" id="uj-bevezetes">
          <h1>ESZKÖZ BEVEZETÉSE A LELTÁRBA</h1>

          <form id="inventory-form" novalidate>
            <div class="form-layout">
              <div class="form-column form-column--primary">
                <div class="form-row">
                  <label for="name">Eszköz neve:</label>
                  <input id="name" name="name" type="text" required autocomplete="off" />
                </div>

                <div class="form-row">
                  <label for="quantity">Darabszám:</label>
                  <input id="quantity" name="quantity" type="number" min="1" max="99" step="1" required />
                </div>

                <div class="form-row">
                  <label for="owner">Tulajdonos:</label>
                  <select id="owner" name="owner" required>
                    <option value="">Válassz tulajdonost</option>
                  </select>
                </div>

                <div class="form-row">
                  <label for="device-type">Eszköztípus:</label>
                  <select id="device-type" name="deviceType" required>
                    <option value="">Válassz eszköztípust</option>
                  </select>
                </div>

                <div class="form-row">
                  <label for="manufacturer">Gyártó/márka:</label>
                  <select id="manufacturer" name="manufacturer">
                    <option value="">Válassz gyártót</option>
                  </select>
                </div>

                <div class="form-row">
                  <label for="model">Típus:</label>
                  <select id="model" name="model">
                    <option value="">Válassz típust</option>
                  </select>
                </div>

                <div class="form-row">
                  <label for="subtype">Altípus:</label>
                  <div id="subtype-controls" class="subtype-controls">
                    <select id="subtype" name="subtype">
                      <option value="">Válassz altípust</option>
                    </select>
                    <select id="subtype-first" name="subtypeFirst" aria-label="Altípus első számjegye" hidden>
                      <option value="">Első számjegy</option>
                    </select>
                    <select id="subtype-second" name="subtypeSecond" aria-label="Altípus második számjegye" hidden>
                      <option value="">Második számjegy</option>
                    </select>
                    <input id="subtype-custom" name="subtypeCustom" type="text" inputmode="numeric"
                      minlength="1" maxlength="2" pattern="[0-9]{1,2}" placeholder="0–99"
                      aria-label="Egyéni altípus" hidden />
                  </div>
                </div>

                <div class="form-row form-row--calculated">
                  <label for="inventory-number">Leltári szám(ok):</label>
                  <em id="inventory-number">Formátum: ESZ-PS-DK65-01</em>
                </div>

                <div class="form-row form-row--spaced">
                  <label for="unit-value">Egységérték:</label>
                  <input id="unit-value" name="unitValue" type="number" min="0" step="0.01" inputmode="decimal" />
                </div>

                <div class="form-row form-row--calculated">
                  <label for="total-value">Összérték:</label>
                  <em id="total-value">Később automatikusan számolva</em>
                </div>

                <div class="form-row serial-row">
                  <label for="serial-1">Sorozatszám(ok):</label>
                  <div id="serial-inputs" class="serial-inputs"></div>
                </div>
              </div>

              <div class="form-column form-column--secondary">
                <div class="form-row form-row--textarea">
                  <label for="storage">Tárolás helye, módja:</label>
                  <textarea id="storage" name="storage" rows="4"></textarea>
                </div>

                <div class="form-row form-row--textarea">
                  <label for="notes">Megjegyzés:</label>
                  <textarea id="notes" name="notes" rows="4"></textarea>
                </div>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" id="save-button">Mentés</button>
              <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
            </div>
          </form>
        </section>

        <section class="inventory-page inventory-page--table" id="leltar" hidden>
          <div class="page-heading">
            <h1>LELTÁR</h1>
            <button type="button" id="refresh-inventory" class="secondary-button">Frissítés</button>
          </div>

          <div class="inventory-toolbar">
            <label>
              Keresés
              <input id="inventory-search" type="search" placeholder="Név, leltári szám, sorozatszám..." />
            </label>
            <label>
              Tulajdonos
              <select id="inventory-owner-filter"><option value="">Mindegyik</option></select>
            </label>
            <label>
              Eszköztípus
              <select id="inventory-device-type-filter"><option value="">Mindegyik</option></select>
            </label>
            <label>
              Típus
              <select id="inventory-model-filter"><option value="">Mindegyik</option></select>
            </label>
            <label>
              Gyártó/márka
              <select id="inventory-manufacturer-filter"><option value="">Mindegyik</option></select>
            </label>
            <div class="inventory-filter-actions">
              <button type="button" id="apply-inventory-filters">Szűrők alkalmazása</button>
              <button type="button" id="clear-inventory-filters" class="secondary-button">Szűrők törlése</button>
            </div>
          </div>

          <p id="inventory-status" class="form-status" role="status" aria-live="polite"></p>
          <div class="table-wrapper">
            <table class="inventory-table">
              <thead>
                <tr>
                  <th><button type="button" class="sort-button" data-sort="name">Név</button></th>
                  <th><button type="button" class="sort-button" data-sort="code">Leltári szám</button></th>
                  <th><button type="button" class="sort-button" data-sort="price">Egységérték</button></th>
                  <th>Sorozatszám(ok)</th>
                  <th>Tárolás helye, módja</th>
                  <th>Megjegyzés</th>
                </tr>
              </thead>
              <tbody id="inventory-body"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <dialog id="edit-dialog">
      <form method="dialog" id="edit-form">
        <h2>Eszköz szerkesztése</h2>
        <label>Név<input name="name" required /></label>
        <label>Egységérték<input name="price" type="number" min="0" step="0.01" /></label>
        <label>Sorozatszám<input name="serialNumber" /></label>
        <label>Tárolás helye, módja<textarea name="placement" rows="3"></textarea></label>
        <label>Megjegyzés<textarea name="comment" rows="3"></textarea></label>
        <div class="dialog-actions">
          <button type="button" id="cancel-edit" class="secondary-button">Mégse</button>
          <button type="submit">Mentés</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
